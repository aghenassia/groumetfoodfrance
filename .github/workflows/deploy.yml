name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Ensure local dev SSH key is authorized
            LOCAL_KEY="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFydOvxTBurF4vw4B2eGKV844FVeJxMSYiY9JERJvv95 github-actions-deploy"
            mkdir -p /root/.ssh
            grep -qF "$LOCAL_KEY" /root/.ssh/authorized_keys 2>/dev/null || echo "$LOCAL_KEY" >> /root/.ssh/authorized_keys
            chmod 600 /root/.ssh/authorized_keys
            # Update Ringover API key in the actual app directory
            if [ -n "${{ secrets.RINGOVER_API_KEY }}" ]; then
              sed -i '/^RINGOVER_API_KEY/d' /opt/ringover-crm/.env
              echo 'RINGOVER_API_KEY=${{ secrets.RINGOVER_API_KEY }}' >> /opt/ringover-crm/.env
            fi
            # Run pending migrations
            cd /opt/ringover-crm
            docker exec -i $(docker ps -qf "name=postgres") psql -U crm_user -d crm_db -c "
              CREATE TABLE IF NOT EXISTS client_objectives (
                id VARCHAR(36) PRIMARY KEY,
                client_id VARCHAR(36) NOT NULL REFERENCES clients(id) ON DELETE CASCADE,
                metric VARCHAR(30) NOT NULL,
                year INTEGER NOT NULL,
                annual_target NUMERIC(15,2) NOT NULL,
                monthly_targets JSONB NOT NULL,
                filter_product_family VARCHAR(100),
                is_active BOOLEAN NOT NULL DEFAULT TRUE,
                created_by VARCHAR(36) REFERENCES users(id),
                created_at TIMESTAMPTZ DEFAULT NOW(),
                updated_at TIMESTAMPTZ DEFAULT NOW(),
                CONSTRAINT uq_client_objective UNIQUE (client_id, metric, year, filter_product_family)
              );
              CREATE INDEX IF NOT EXISTS idx_client_objectives_client ON client_objectives(client_id);
              CREATE INDEX IF NOT EXISTS idx_client_objectives_year ON client_objectives(year);
              ALTER TABLE clients ADD COLUMN IF NOT EXISTS client_type TEXT;
              ALTER TABLE clients ADD COLUMN IF NOT EXISTS client_subtype TEXT;
              ALTER TABLE contacts ADD COLUMN IF NOT EXISTS birthday DATE;
              ALTER TABLE contacts ADD COLUMN IF NOT EXISTS personal_notes TEXT;
            " || echo "Migration already applied or skipped"
            /opt/deploy-crm.sh
