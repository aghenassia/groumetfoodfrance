name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /root/ringover-crm
            # Update Ringover API key if secret is set
            if [ -n "${{ secrets.RINGOVER_API_KEY }}" ]; then
              sed -i '/^RINGOVER_API/d' .env
              echo 'RINGOVER_API_KEY=${{ secrets.RINGOVER_API_KEY }}' >> .env
            fi
            /opt/deploy-crm.sh
